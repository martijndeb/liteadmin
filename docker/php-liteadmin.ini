; LiteAdmin — SQLite loadable extensions.
;
; The image ships sqlite-vec's vec0 in /var/www/liteadmin/src/ext and config.json
; lists it under "extensions", so it is loaded on every server-database connection.
;
; Pdo\Sqlite::loadExtension() (PHP 8.4+) takes a full path and resolves it with
; realpath(), so no INI directive gates it — LiteAdmin builds that path itself from
; config.json's "ext_dir". The entries below name the same directory for the
; directory-based loaders (ext/sqlite3 today, pdo_sqlite should it gain one), so the
; two never drift apart.
sqlite3.extension_dir = /var/www/liteadmin/src/ext
pdo_sqlite.extension_dir = /var/www/liteadmin/src/ext

; open_basedir is deliberately unset here. If you enable it, the extension directory
; has to be one of its paths or realpath()/dlopen() on vec0.so will be denied and the
; database's "Database" tab will report the extension as failed.
;open_basedir = /var/www/liteadmin/src:/tmp
