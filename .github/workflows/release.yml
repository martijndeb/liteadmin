name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      # The tag alone is enough to build from; the apt repo is fetched shallowly
      # below. Skipping the history keeps the checkout to a couple of seconds
      # even as gh-pages accumulates published .debs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Extract version number
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the packages
        run: |
          sh packaging/build-core.sh "${VERSION}"
          for dir in src/plugins/*/; do
            name="$(basename "$dir")"
            if [ ! -f "packaging/${name}/control" ]; then
              echo "::warning::skipping ${name}: no packaging/${name}/control"
              continue
            fi
            sh packaging/build-plugin.sh "$name" "${VERSION}"
          done

      # Nothing gets published that has not passed the same content, mode and
      # integrity checks the e2e workflow runs on every pull request.
      - name: Verify the packages
        run: sh packaging/verify-deb.sh ./*.deb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.deb --generate-notes
          fi

      - name: Import the signing key
        run: echo "${{ secrets.APT_GPG_KEY }}" | gpg --batch --import

      - name: Update the apt repo
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add aptrepo gh-pages
          mkdir -p aptrepo/pool/main
          cp ./*.deb aptrepo/pool/main/

          # Keep the five most recent versions of each package, not of the pool
          # as a whole -- otherwise a release with several plugins would evict
          # still-referenced core packages.
          for deb in ./*.deb; do
            pkg="$(basename "$deb" | cut -d_ -f1)"
            ls -1v "aptrepo/pool/main/${pkg}_"*.deb | head -n -5 | xargs -r rm --
          done

          cd aptrepo
          mkdir -p dists/stable/main/binary-amd64 \
                   dists/stable/main/binary-arm64 \
                   dists/stable/main/binary-all
          apt-ftparchive --arch all packages pool \
            > dists/stable/main/binary-all/Packages
          cp dists/stable/main/binary-all/Packages dists/stable/main/binary-amd64/
          cp dists/stable/main/binary-all/Packages dists/stable/main/binary-arm64/
          gzip -kf dists/stable/main/binary-*/Packages

          apt-ftparchive -c ../packaging/aptftp.conf release dists/stable \
            > dists/stable/Release
          gpg --batch --yes -abs        -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease   dists/stable/Release

          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "apt: liteadmin ${VERSION}"
          git push origin gh-pages
