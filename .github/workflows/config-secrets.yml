name: config-secrets
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-committed-password-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure src/config.json has an empty auth.password_hash
        run: |
          python3 - <<'PY'
          import json, sys
          with open("src/config.json") as f:
              data = json.load(f)
          if data.get("auth", {}).get("password_hash", ""):
              print("::error file=src/config.json::auth.password_hash must be empty in the "
                    "committed template; reset it to \"\".")
              sys.exit(1)
          print("OK: auth.password_hash is empty.")
          PY
